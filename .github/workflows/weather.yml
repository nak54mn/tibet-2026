yaml
name: update-weather

on:
  schedule:
    # 每天 UTC 23:00 = 上海時間隔天早上 07:00
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch weather
        run: python3 scripts/update_weather.py

      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain weather.js)" ]; then
            git config user.name  "weather-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add weather.js
            git commit -m "weather: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "no change"
          fi
